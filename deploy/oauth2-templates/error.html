<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jira Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Error page for Jira Pulse sign-in (oauth2-proxy custom template). */
  :root { color-scheme: light; --page: #f6f6f3; --surface: #fff; --text: #0b0b0b; --text-2: #52514e; --muted: #7d7b75;
          --border: rgba(11,11,11,.08); --accent: #2a78d6; --accent-hover: #1f62b3; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --page: #0d0d0d; --surface: #171716;
          --text: #f0efec; --text-2: #c3c2b7; --muted: #918f88; --border: rgba(255,255,255,.09); --accent: #3987e5; --accent-hover: #5a9cec; } }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--page); color: var(--text);
         font: 15px/1.55 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width: min(460px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 32px 28px; text-align: center; }
  .logo { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; color: #fff; font-size: 18px;
          background: var(--accent); }
  h1 { font-size: 22px; letter-spacing: -.02em; margin: 16px 0 8px; }
  p { color: var(--text-2); margin: 0 0 6px; }
  .code { font-size: 12px; color: var(--muted); margin-top: 14px; }
  a.btn { display: inline-block; margin-top: 20px; padding: 11px 18px; border-radius: 12px; color: #fff; text-decoration: none; font-weight: 600;
          background: var(--accent); }
  a.btn:hover { background: var(--accent-hover); }
</style>
</head>
<body>
  <div class="card">
    <span class="logo" aria-hidden="true">◆</span>
    <h1>{{.Title}}</h1>
    <p>{{.Message}}</p>
    <p>Jira Pulse is for your company's Google accounts. If you signed in with another account, sign out of it in Google and try again.</p>
    <a class="btn" href="{{.ProxyPrefix}}/sign_out">Try again</a>
    <div class="code">Error {{.StatusCode}}</div>
  </div>
</body>
</html>
